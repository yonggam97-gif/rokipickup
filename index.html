<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="로키 픽업">
<meta name="theme-color" content="#ffffff">
<title>로키 픽업</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--b:#1A5CFF;--b2:#E8EFFF;--t:#111418;--g:#6B7280;--l:#F2F4F6;--line:#E5E8EB;--o:#B54708;--ob:#FFF4E5;--ok:#0F7B3F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#EEF1F4;color:var(--t);font-family:'Noto Sans KR',-apple-system,sans-serif;font-size:15px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:#EEF1F4}
#map{position:absolute;inset:0;z-index:0}
.screen{position:absolute;inset:0;display:none;z-index:5;pointer-events:none}
.screen.on{display:block}
.screen>*{pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(17,20,24,.12);display:flex;flex-direction:column;max-height:100%}
.full{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column}
.grab{width:40px;height:4px;border-radius:2px;background:#D7DCE1;align-self:center;margin:10px 0 4px}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.pad{padding:12px 20px}
.bar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:#fff;border-bottom:1px solid #F0F2F4}
.bar h2{margin:0;font-size:19px;font-weight:900;flex:1}
.back{border:none;background:none;font-size:28px;width:44px;height:44px;line-height:1}
.float{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(17,20,24,.14);display:flex;align-items:center;gap:6px;padding:4px 8px;min-height:54px}
.btn{border:none;border-radius:16px;background:var(--b);color:#fff;font-weight:700;font-size:17px;min-height:56px;width:100%}
.btn.sub{background:var(--l);color:var(--t)}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.lbl{font-size:13px;color:var(--g);margin:14px 0 6px}
.h{font-size:16px;font-weight:700;margin:16px 0 8px}
.inp{width:100%;border:none;background:var(--l);border-radius:12px;padding:13px 14px;font-size:16px}
.card{background:var(--l);border-radius:14px;padding:12px 14px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:18px;min-height:36px;padding:0 12px;font-size:13px;margin:0 6px 6px 0}
.chip.on{border:2px solid var(--b);background:#F3F6FF;color:var(--b);font-weight:700}
.muted{color:var(--g);font-size:13px}
.person{display:flex;align-items:center;gap:12px;padding:8px 0}
.av{width:40px;height:40px;border-radius:20px;background:var(--b2);color:var(--b);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center}
.chk span{width:26px;height:26px;border-radius:13px;border:2px solid #C5CBD2;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.chk.on span{background:var(--b);border-color:var(--b)}
.list-item{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #F0F2F4}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;flex-shrink:0}
.tab{flex:0 0 136px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px 12px}
.tab.on{border:2px solid var(--b);background:#F3F6FF}
.tab .n{font-size:13px;font-weight:700;color:var(--g)}
.tab.on .n{color:var(--b)}
.tab .tm{font-size:24px;font-weight:900;letter-spacing:-.5px}
.tl{display:flex;gap:12px;padding:8px 0;align-items:flex-start}
.tl .t{width:50px;flex-shrink:0;font-weight:900}
.gap{display:flex;align-items:center;gap:8px;margin-left:22px;padding:2px 0 2px 36px;border-left:2px dotted #C9D4F0}
.step{display:flex;align-items:center;background:var(--l);border-radius:12px}
.step button{border:none;background:none;width:40px;height:40px;font-size:18px}
.note{font-size:12px;font-weight:700;color:var(--o);background:var(--ob);border-radius:8px;padding:4px 8px;display:inline-block;margin-top:4px}
.badge{width:30px;height:30px;border-radius:8px;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.banner{background:#FFF4E5;color:var(--o);font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:8px}
.overlay{position:absolute;inset:0;background:rgba(17,20,24,.35);z-index:20;display:none}
.overlay.on{display:block}
.overlay .sheet{top:90px}
.pinmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.pinmark .lab{background:var(--t);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap}
.pinmark .dot{width:22px;height:22px;border-radius:11px;background:var(--b);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);margin-top:4px}
.pinmark .stem{width:3px;height:12px;background:var(--b)}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;display:none;max-width:90%}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #fff;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.leaflet-container{background:#EEF1F4;font-family:inherit}
.mk{display:flex;align-items:center;justify-content:center;border-radius:13px;border:3px solid var(--b);background:#fff;color:var(--b);font-weight:900;font-size:13px;width:26px;height:26px}
.mk.home{background:var(--t);border-color:var(--t);color:#fff;width:auto;padding:0 6px;font-size:11px;border-radius:8px}
.mk.dest{background:var(--b);color:#fff;width:auto;padding:0 6px;font-size:11px;border-radius:8px}
.mk.wp{border-radius:8px;border:2px solid #fff;color:#fff;font-size:11px}
.safe-b{padding-bottom:calc(env(safe-area-inset-bottom) + 14px)}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <!-- 홈 -->
  <section class="screen" id="s-home">
    <div class="float"><span style="width:10px;height:10px;border-radius:5px;background:var(--b);margin-left:8px"></span>
      <button style="flex:1;text-align:left;border:none;background:none;font-size:17px;color:var(--g);min-height:46px" onclick="go('form')">어디로 픽업 가세요?</button>
      <button class="back" style="font-size:20px" aria-label="설정" onclick="go('settings')">⚙</button>
    </div>
    <div class="sheet safe-b" style="max-height:62%">
      <div class="grab"></div>
      <div class="scroll pad" id="home-body"></div>
    </div>
  </section>

  <!-- 입력 -->
  <section class="screen" id="s-form">
    <div class="full">
      <div class="bar"><button class="back" onclick="go('home')" aria-label="뒤로">‹</button><h2>픽업 스케줄 정하기</h2></div>
      <div class="scroll pad" id="form-body"></div>
      <div class="pad safe-b" style="border-top:1px solid #F0F2F4"><button class="btn" id="calc-btn" onclick="runCalc()">경로 계산하기</button></div>
    </div>
  </section>

  <!-- 결과 -->
  <section class="screen" id="s-result">
    <div class="float">
      <button class="back" onclick="go('form')" aria-label="뒤로">‹</button>
      <div style="flex:1;min-width:0"><div id="r-title" style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div><div class="muted" id="r-sub"></div></div>
    </div>
    <div class="sheet" id="r-sheet" style="height:58%">
      <div class="grab" onclick="toggleSheet()"></div>
      <div class="tabs" id="r-tabs"></div>
      <div class="scroll" style="padding:0 20px 10px" id="r-body"></div>
      <div class="row safe-b" style="padding:10px 16px 0;border-top:1px solid #F0F2F4">
        <button class="btn sub" style="flex:1" onclick="openAdjust()">일정 조율</button>
        <button class="btn" style="flex:2" onclick="confirmPlan()">이 경로로 확정</button>
      </div>
    </div>
  </section>

  <!-- 확정 -->
  <section class="screen" id="s-done">
    <div class="sheet safe-b" style="max-height:80%">
      <div class="grab"></div>
      <div class="scroll pad" id="done-body"></div>
    </div>
  </section>

  <!-- 사람 관리 -->
  <section class="screen" id="s-people">
    <div class="full">
      <div class="bar"><button class="back" onclick="go(peopleBack)" aria-label="뒤로">‹</button><h2>자주 태우는 사람</h2></div>
      <div class="scroll pad" id="people-body"></div>
    </div>
  </section>

  <!-- 사람 편집 -->
  <section class="screen" id="s-person">
    <div class="full">
      <div class="bar"><button class="back" onclick="go('people')" aria-label="뒤로">‹</button><h2 id="pe-title">사람</h2></div>
      <div class="scroll pad" id="person-body"></div>
      <div class="pad safe-b" style="border-top:1px solid #F0F2F4"><button class="btn" onclick="savePerson()">저장</button></div>
    </div>
  </section>

  <!-- 설정 -->
  <section class="screen" id="s-settings">
    <div class="full">
      <div class="bar"><button class="back" onclick="go('home')" aria-label="뒤로">‹</button><h2>설정</h2></div>
      <div class="scroll pad" id="settings-body"></div>
      <div class="pad safe-b" style="border-top:1px solid #F0F2F4"><button class="btn" onclick="saveSettings()">저장</button></div>
    </div>
  </section>

  <!-- 핀 찍기 -->
  <section class="screen" id="s-pin">
    <div class="pinmark"><div class="lab">여기서 탑승</div><div class="dot"></div><div class="stem"></div></div>
    <div class="float"><button class="back" onclick="pinCancel()" aria-label="닫기">‹</button><div style="flex:1;font-weight:700">지도를 끌어서 정확한 위치에 맞추세요</div></div>
    <div class="sheet safe-b pad">
      <div class="lbl" style="margin-top:0">이 장소 이름</div>
      <input class="inp" id="pin-name" placeholder="예) 동래역 4번 출구 옆 골목">
      <div class="lbl">찾아오는 법 메모 (선택)</div>
      <input class="inp" id="pin-memo" placeholder="예) GS25 지나서 오른쪽 골목">
      <div style="height:12px"></div>
      <button class="btn" onclick="pinOk()">이 위치로 정하기</button>
    </div>
  </section>

  <!-- 검색 시트 -->
  <div class="overlay" id="ov-search"><div class="sheet safe-b">
    <div class="row pad" style="padding-top:16px"><b style="flex:1;font-size:19px" id="se-title">장소 검색</b><button class="btn sub sm" onclick="closeOv('ov-search')">닫기</button></div>
    <div class="pad" style="padding-top:0"><div class="row"><input class="inp" id="se-q" placeholder="장소, 주소, 역 이름" onkeydown="if(event.key==='Enter')doSearch()"><button class="btn sm" onclick="doSearch()">검색</button></div>
    <button class="chip" style="margin-top:10px" onclick="searchToPin()">지도에서 직접 찍기</button></div>
    <div class="scroll pad" id="se-list" style="padding-top:0"></div>
  </div></div>

  <!-- 조율 시트 -->
  <div class="overlay" id="ov-adjust"><div class="sheet safe-b">
    <div class="row pad" style="padding-top:16px"><b style="flex:1;font-size:19px">픽업 일정 조율</b><button class="btn sub sm" onclick="closeOv('ov-adjust')">닫기</button></div>
    <div class="muted" style="padding:0 20px">바뀐 사람만 바꿔주세요</div>
    <div class="scroll pad" id="adj-body"></div>
    <div class="pad"><button class="btn" onclick="closeOv('ov-adjust');runCalc()">다시 계산하기</button></div>
  </div></div>

  <!-- 경유지 시트 -->
  <div class="overlay" id="ov-wp"><div class="sheet safe-b">
    <div class="row pad" style="padding-top:16px"><b style="flex:1;font-size:19px">경유지 추가</b><button class="btn sub sm" onclick="closeOv('ov-wp')">닫기</button></div>
    <div class="row" style="padding:0 20px" id="wp-cats"></div>
    <div class="pad" style="padding-bottom:4px"><input class="inp" id="wp-q" placeholder="이름으로 걸러보기" oninput="renderWp()"></div>
    <div class="row" style="padding:0 20px;gap:14px" id="wp-sort"></div>
    <div class="scroll pad" id="wp-list" style="padding-top:0"></div>
  </div></div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
// ---------- 저장소 ----------
const S={get(k,d){try{const v=localStorage.getItem('rp_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('rp_'+k,JSON.stringify(v))}catch(e){}}};
let settings=Object.assign({appKey:'',kakaoKey:'',syncUrl:'',home:null,kmpl:11,fuel:1650,stopMin:3,sepMin:40,vehicle:''},S.get('settings',{}));
let people=S.get('people',[]);
let schedules=S.get('schedules',[]);
let job=S.get('job',null)||newJob();
let plans=null, curPlan=1, peopleBack='home';
function newJob(){const d=new Date();d.setDate(d.getDate()+1);return{dest:null,date:d.toISOString().slice(0,10),time:'11:00',ids:[],off:{},spot:{},buf:{},wps:[]}}
function saveJob(){S.set('job',job)}
const uid=()=>Math.random().toString(36).slice(2,9);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ms){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms||2200)}
const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const mins=s=>Math.round(s/60);
function dur(s){const m=Math.round(s/60);return m>=60?Math.floor(m/60)+'시간 '+(m%60?m%60+'분':''):m+'분'}
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
function km(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const demo=()=>!settings.appKey;

// ---------- 티맵 API ----------
const API={
  base:'https://apis.openapi.sk.com',
  h(){return{appKey:settings.appKey,'Content-Type':'application/json',Accept:'application/json'}},
  parsePoi(p){return{name:p.name,addr:[p.upperAddrName,p.middleAddrName,p.lowerAddrName,p.detailAddrName].filter(Boolean).join(' ')+(p.firstNo?' '+p.firstNo+(p.secondNo&&p.secondNo!=='0'?'-'+p.secondNo:''):''),lat:+(p.frontLat||p.noorLat),lon:+(p.frontLon||p.noorLon),tel:p.telNo||''}},
  async poi(q){
    if(demo()){const c=settings.home||{lat:35.1578,lon:129.0590};return[0,1,2].map(i=>({name:q+(i?' '+(i+1):''),addr:'예시 모드 주소',lat:c.lat+0.02*(i+1),lon:c.lon-0.03*(i+1)}))}
    const r=await fetch(this.base+'/tmap/pois?version=1&count=10&reqCoordType=WGS84GEO&resCoordType=WGS84GEO&searchKeyword='+encodeURIComponent(q),{headers:{appKey:settings.appKey}});
    if(r.status===204)return[];
    if(!r.ok)throw new Error('검색 실패 ('+r.status+')');
    const j=await r.json();return((j.searchPoiInfo&&j.searchPoiInfo.pois&&j.searchPoiInfo.pois.poi)||[]).map(p=>this.parsePoi(p));
  },
  async around(c,cat){
    if(demo()){return[1,2,3].map(i=>({name:cat+' 예시 '+i,addr:'예시',lat:c.lat+0.003*i,lon:c.lon+0.002*i,tel:''}))}
    const r=await fetch(this.base+'/tmap/pois/search/around?version=1&count=8&radius=1&reqCoordType=WGS84GEO&resCoordType=WGS84GEO&centerLat='+c.lat+'&centerLon='+c.lon+'&categories='+encodeURIComponent(cat),{headers:{appKey:settings.appKey}});
    if(r.status===204)return[];if(!r.ok)return[];
    const j=await r.json();return((j.searchPoiInfo&&j.searchPoiInfo.pois&&j.searchPoiInfo.pois.poi)||[]).map(p=>this.parsePoi(p));
  },
  async geo(q){
    if(!q)return null;
    if(demo()){const r=await this.poi(q);return r[0]||null}
    try{const r=await fetch(this.base+'/tmap/geo/fullAddrGeo?version=1&addressFlag=F00&coordType=WGS84GEO&fullAddr='+encodeURIComponent(q),{headers:{appKey:settings.appKey}});
      if(r.ok&&r.status!==204){const j=await r.json();const c=j.coordinateInfo&&j.coordinateInfo.coordinate&&j.coordinateInfo.coordinate[0];
        if(c){const lat=+(c.newLat||c.lat),lon=+(c.newLon||c.lon);if(lat&&lon)return{name:q,addr:q,lat,lon}}}}catch(e){}
    try{const r=await this.poi(q);if(r[0])return r[0]}catch(e){}
    return null;
  },
  cache:S.get('legcache',{}),
  async car(a,b){
    const key=[a.lat,a.lon,b.lat,b.lon].map(v=>(+v).toFixed(4)).join(',');
    if(this.cache[key]&&Date.now()-this.cache[key].at<6*3600e3)return this.cache[key];
    let out;
    if(demo()){const d=km(a,b)*1.3;out={sec:Math.round(d/32*3600+120),m:d*1000,toll:0,taxi:3800+d*1000/131*100,line:[[a.lat,a.lon],[b.lat,b.lon]]}}
    else{
      const r=await fetch(this.base+'/tmap/routes?version=1',{method:'POST',headers:this.h(),body:JSON.stringify({startX:''+a.lon,startY:''+a.lat,endX:''+b.lon,endY:''+b.lat,reqCoordType:'WGS84GEO',resCoordType:'WGS84GEO',searchOption:'0'})});
      if(!r.ok)throw new Error('길찾기 실패 ('+r.status+')');
      const j=await r.json();const p=j.features[0].properties;const line=[];
      j.features.forEach(f=>{if(f.geometry.type==='LineString')f.geometry.coordinates.forEach(c=>line.push([c[1],c[0]]))});
      out={sec:p.totalTime,m:p.totalDistance,toll:p.totalFare||0,taxi:p.taxiFare||0,line};
    }
    out.at=Date.now();this.cache[key]=out;
    const ks=Object.keys(this.cache);if(ks.length>300)ks.slice(0,100).forEach(k=>delete this.cache[k]);
    S.set('legcache',this.cache);return out;
  },
  // 도착 시각을 정하고, 그 시간대 평균 교통량으로 출발 시각 예측 (경유지 최대 5곳)
  async arriveBy(a,b,vias,arrive){
    if(demo())return null;
    const pad=n=>String(n).padStart(2,'0');
    const t=`${arrive.getFullYear()}-${pad(arrive.getMonth()+1)}-${pad(arrive.getDate())}T${pad(arrive.getHours())}:${pad(arrive.getMinutes())}:00+0900`;
    const ri={departure:{name:'출발',lon:''+a.lon,lat:''+a.lat},destination:{name:'도착',lon:''+b.lon,lat:''+b.lat},predictionType:'departure',predictionTime:t,searchOption:'00'};
    if(vias.length)ri.wayPoints={wayPoint:vias.slice(0,5).map(v=>({lon:''+v.lon,lat:''+v.lat}))};
    const r=await fetch(this.base+'/tmap/routes/prediction?version=1&reqCoordType=WGS84GEO&resCoordType=WGS84GEO&sort=index',{method:'POST',headers:this.h(),body:JSON.stringify({routesInfo:ri})});
    if(!r.ok)return null;
    const j=await r.json();const p=j.features&&j.features[0]&&j.features[0].properties;if(!p)return null;
    return{sec:p.totalTime,m:p.totalDistance,toll:p.totalFare||0,departure:new Date(p.departureTime.replace(/(\d{2})(\d{2})$/,'$1:$2'))};
  },
  transitOk:true,
  async transit(a,b){
    const est=()=>{const d=km(a,b);return{sec:Math.round(d*1.25/20*3600+12*60),fare:d>10?1750:1550,est:true,text:'대중교통 예상 (어림값)'}};
    if(settings.kakaoKey){
      try{
        const r=await fetch('https://dapi.kakao.com/v2/routing/publictraffic?start_x='+a.lon+'&start_y='+a.lat+'&end_x='+b.lon+'&end_y='+b.lat,{headers:{Authorization:'KakaoAK '+settings.kakaoKey}});
        if(r.ok){const j=await r.json();const rs=(j.routes||[]).filter(x=>x.properties&&x.properties.totalTime);
          if(rs.length){rs.sort((x,y)=>x.properties.totalTime-y.properties.totalTime);const it=rs[0];
            const legs=(it.steps||[]).filter(st=>st.properties&&st.properties.type!=='WALKING').map(st=>{const v=(st.properties.vehicles||[])[0];const stops=st.properties.stops||[];return(st.properties.type==='SUBWAY'?'지하철 ':'버스 ')+(v?v.name:'')+(stops.length?' '+stops[0].name+'→'+stops[stops.length-1].name:'')});
            return{sec:it.properties.totalTime,fare:it.properties.fare?it.properties.fare.value:0,transfers:it.properties.transfers,text:legs.join(' · ')||'도보'}}}
        else this.kakaoErr=r.status;
      }catch(e){this.kakaoErr='연결 실패'}
    }
    if(demo()||!this.transitOk)return est();
    try{
      const r=await fetch(this.base+'/transit/routes',{method:'POST',headers:this.h(),body:JSON.stringify({startX:''+a.lon,startY:''+a.lat,endX:''+b.lon,endY:''+b.lat,count:3,lang:0,format:'json'})});
      if(r.status===403){this.transitOk=false;return est()}
      if(!r.ok)return est();
      const j=await r.json();const its=j.metaData&&j.metaData.plan&&j.metaData.plan.itineraries;if(!its||!its.length)return est();
      its.sort((x,y)=>x.totalTime-y.totalTime);const it=its[0];
      const legs=(it.legs||[]).filter(l=>l.mode!=='WALK').map(l=>(l.mode==='SUBWAY'?'지하철 ':l.mode==='BUS'?'버스 ':'')+(l.route||'')+' '+(l.start&&l.start.name||'')+'→'+(l.end&&l.end.name||''));
      return{sec:it.totalTime,fare:it.fare&&it.fare.regular?it.fare.regular.totalFare:0,transfers:it.transferCount,text:legs.join(' · ')||'도보'};
    }catch(e){return est()}
  }
};

// ---------- 계산 ----------
function perms(a){if(a.length<=1)return[a.slice()];const o=[];a.forEach((x,i)=>{perms(a.slice(0,i).concat(a.slice(i+1))).forEach(p=>o.push([x].concat(p)))});return o}
function arriveDate(){const[h,m]=job.time.split(':').map(Number);const d=new Date(job.date+'T00:00:00');d.setHours(h,m,0,0);return d}
async function runCalc(){
  if(!job.dest){toast('도착지를 정해주세요');return}
  job.from=job.from||settings.home;if(!job.from){toast('설정에서 집을 정해주세요');return}
  const sel=people.filter(p=>job.ids.includes(p.id));
  const btn=$('calc-btn');btn.disabled=true;btn.innerHTML='<span class="spin"></span> 계산 중...';
  try{plans=await planAll(sel);curPlan=plans[1]&&plans[1].seq.length?1:0;saveJob();go('result')}
  catch(e){console.error(e);toast('계산 중 문제가 생겼어요: '+e.message,4000)}
  finally{btn.disabled=false;btn.textContent='경로 계산하기'}
}
async function planAll(sel){
  const H=job.from,D=job.dest,arrive=arriveDate(),stopS=settings.stopMin*60;
  const base=await API.car(H,D);
  const kpk=base.sec/Math.max(0.5,km(H,D)); // 초/km 보정값
  const est=(a,b)=>Math.max(90,km(a,b)*kpk*1.05);
  // 대중교통 (집 → 도착)
  const tr={};for(const p of sel){tr[p.id]=await API.transit(p.spots[0],D)}
  window._trc=tr;
  // 후보 장소: 본인 장소들 + 1.5km 안에 사는 다른 사람 집
  const cands={};sel.forEach(p=>{cands[p.id]=p.spots.map((s,i)=>({s,label:i?(s.label||s.name):((s.label&&s.label!=='집')?s.label:'집 앞'),kind:i?'spot':'home'}));sel.forEach(q=>{if(q!==p&&km(p.spots[0],q.spots[0])<1.5)cands[p.id].push({s:q.spots[0],label:q.name+' 집 앞',kind:'other',with:q.name})})});
  const fixedSpot=p=>{const i=job.spot[p.id];return i!=null&&p.spots[i]?{s:p.spots[i],label:p.spots[i].label||p.spots[i].name,kind:i?'spot':'home'}:null};
  function bestOrder(list,spotOf){let best=null;for(const o of perms(list)){let t=0,prev=H;for(const p of o){const s=spotOf(p);t+=est(prev,s.s)+stopS;prev=s.s}t+=est(prev,D);if(!best||t<best.t)best={t,o}}return best?best.o:[]}
  async function build(key,name,desc,riders,spotOf,selfs){
    const order=bestOrder(riders,spotOf);
    const seq=order.map(p=>({p,c:spotOf(p)}));
    // 같은 장소에서 함께 타는 경우 묶기
    const pts=[H].concat(seq.map(x=>x.c.s)).concat([D]);
    const legs=[];for(let i=0;i<pts.length-1;i++){legs.push(km(pts[i],pts[i+1])<0.05?{sec:0,m:0,toll:0,line:[]}:await API.car(pts[i],pts[i+1]))}
    return{key,name,desc,seq,legs,selfs:selfs.map(p=>({p,tr:tr[p.id]})),pts};
  }
  const home=p=>fixedSpot(p)||cands[p.id][0];
  const riders=sel.filter(p=>!job.off[p.id]),forced=sel.filter(p=>job.off[p.id]);
  // 최적 픽업: 사람마다 후보 중 운전 시간이 가장 짧아지는 곳 (조합 탐색)
  let bestCombo=null;const lists=riders.map(p=>fixedSpot(p)?[fixedSpot(p)]:cands[p.id]);
  let combos=[[]];lists.forEach(l=>{const n=[];combos.forEach(c=>l.forEach(x=>n.push(c.concat([x]))));combos=n.slice(0,4000)});
  for(const c of combos){const m=new Map(riders.map((p,i)=>[p,c[i]]));const o=bestOrder(riders,p=>m.get(p));let t=0,prev=H;o.forEach(p=>{t+=est(prev,m.get(p).s)+stopS;prev=m.get(p).s});t+=est(prev,D);
    // 걷기/이동 부담: 집에서 1km 넘게 떨어진 곳은 약간 불리하게
    c.forEach((x,i)=>{t+=Math.max(0,km(riders[i].spots[0],x.s)-0.8)*240});
    if(!bestCombo||t<bestCombo.t)bestCombo={t,m}}
  const P=[];
  P.push(await build('premium','프리미엄','전원 집 앞',riders,home,forced));
  P.push(await build('optimal','최적 픽업','역·다른 집에서 만남',riders,p=>bestCombo?bestCombo.m.get(p):home(p),forced));
  {const a0=finalize(P[0],arrive),a1=finalize(P[1],arrive);if(a1.depart<=a0.depart){P[1]=Object.assign({},P[0],{key:'optimal',name:'최적 픽업',desc:'집 앞 픽업이 제일 빨라요'})}}
  // 혼합: 프리미엄 기준 차에 너무 오래 타는 사람은 따로
  const prem=finalize(P[0],arrive,0);const sepS=settings.sepMin*60;
  const sepIds=prem.stops.filter(s=>s.ride-(tr[s.p.id].sec)>=sepS).map(s=>s.p.id);
  P.push(await build('mixed','혼합',sepIds.length?'오래 타는 사람은 따로':'따로 올 사람 없음',riders.filter(p=>!sepIds.includes(p.id)),home,forced.concat(riders.filter(p=>sepIds.includes(p.id)))));
  P.push(await build('solo','각자 이동','전원 대중교통',[],home,sel));
  // 시간대 교통량 반영 (경유지 포함 예측)
  for(const p of P){
    const vias=p.pts.slice(1,-1);
    try{const pr=await API.arriveBy(H,D,vias,arrive);if(pr){const normal=p.legs.reduce((a,l)=>a+l.sec,0);p.tf=normal?Math.min(2,Math.max(0.7,pr.sec/normal)):1;p.toll=pr.toll}else p.tf=1}catch(e){p.tf=1}
  }
  return P;
}
// 출발·도착 시각 계산 (여유 시간·경유지 포함)
function finalize(p,arrive,idx){
  arrive=arrive||arriveDate();const stopS=settings.stopMin*60,tf=p.tf||1;
  const n=p.seq.length;const buf=(job.buf[p.key]||{});const wps=(job.wps||[]).filter(w=>w.plan===p.key);
  const extra=[];for(let g=0;g<=n;g++){extra[g]=(buf[g]||0)*60;wps.filter(w=>w.gap===g).forEach(w=>extra[g]+=w.extra)}
  // 같은 장소 연속 탑승은 정차 1번만
  const stopAt=i=>i>0&&p.legs[i].sec===0?0:stopS;
  let total=0;p.legs.forEach(l=>total+=l.sec*tf);for(let i=0;i<n;i++)total+=stopAt(i);extra.forEach(e=>total+=e);
  const depart=new Date(arrive.getTime()-total*1000);
  let t=depart.getTime();const times=[];
  for(let i=0;i<n;i++){t+=extra[i]*1000;t+=p.legs[i].sec*tf*1000;times.push(new Date(t));t+=stopAt(i)*1000}
  const stops=p.seq.map((x,i)=>({p:x.p,c:x.c,spot:x.c.s,time:times[i],ride:(arrive-times[i])/1000}));
  const m=p.legs.reduce((a,l)=>a+l.m,0);
  const driveS=total-n*stopS;
  return{depart,arrive,stops,meters:m,driveS,fuel:m/1000/settings.kmpl*settings.fuel,toll:p.toll!=null?p.toll:p.legs.reduce((a,l)=>a+(l.toll||0),0),extra,wps,n};
}

async function loadWp(){

  const p=plans[curPlan];const pts=p.pts;const found=new Map();
  for(let g=0;g<pts.length-1;g++){
    const line=p.legs[g].line&&p.legs[g].line.length?p.legs[g].line:[[pts[g].lat,pts[g].lon],[pts[g+1].lat,pts[g+1].lon]];
    const samples=[0.25,0.5,0.75].map(f=>line[Math.min(line.length-1,Math.floor(line.length*f))]).map(x=>({lat:x[0],lon:x[1]}));
    for(const c of samples){const r=await API.around(c,CAT[wpCat].q);r.forEach(x=>{const k=x.name+x.lat.toFixed(4);if(found.has(k))return;let best=1e9;line.forEach(q=>{const d=km({lat:q[0],lon:q[1]},x);if(d<best)best=d});found.set(k,Object.assign(x,{gap:g,dist:Math.round(best*1000)}))})}

  <div class="muted">${a.getMonth()+1}/${a.getDate()} ${hm(a)} ${esc(s.destName)} 도착 · ${esc(s.planName)} · 운전 ${dur(s.drive)} · ${(s.meters/1000).toFixed(1)}km · 기름값 약 ${won(s.fuel)}${s.toll?' · 통행료 '+won(s.toll):''}</div>
  <div class="h">티맵으로 안내 (순서대로 누르세요)</div>`;
  const stops=s.stops.map(x=>({n:x.name+' · '+x.label,lat:x.lat,lon:x.lon}));
  stops.push({n:s.destName+' (도착)',lat:s.dest.lat,lon:s.dest.lon});
  stops.forEach((x,i)=>{h+=`<a class="list-item" style="text-decoration:none;color:inherit" href="${tmapLink(x.n,x.lat,x.lon)}"><span class="av" style="width:32px;height:32px">${i+1}</span><b style="flex:1">${esc(x.n)}</b><span style="color:var(--b);font-weight:700">안내 ›</span></a>`});
  h+=`<div style="height:14px"></div><button class="btn" onclick="share(noticeText(window._sch))">단톡방에 픽업 공지 공유</button>
  <div class="row" style="margin-top:8px"><a class="btn sub" style="flex:1;display:flex;align-items:center;justify-content:center;text-decoration:none" href="${gcalLink(s)}" target="_blank" rel="noopener">구글 캘린더에 넣기</a><button class="btn sub" style="flex:1" onclick="copyAcc()">회계용 복사</button></div>`;
  if(s.stops.length){h+=`<div class="h">사람별 픽업 위치 보내기</div>`;s.stops.forEach((x,i)=>{h+=`<div class="list-item"><div style="flex:1;min-width:0"><b>${esc(x.name)}</b> <span class="muted">${hm(new Date(x.time))}</span><div class="muted">${esc(x.label)}${x.memo?' · '+esc(x.memo):''}</div></div><button class="btn sub sm" onclick="sharePerson(${i})">위치 공유</button>${x.phone?`<a class="btn sub sm" style="display:flex;align-items:center;text-decoration:none" href="tel:${esc(x.phone)}">전화</a>`:''}</div>`})}
  h+=`<div class="row" style="margin-top:14px"><button class="btn sub" style="flex:1" onclick="delSchedule()">일정 삭제</button><button class="btn sub" style="flex:1" onclick="go('home')">처음으로</button></div>`;
  $('done-body').innerHTML=h;
  layer.clearLayers();const pts=[[s.from.lat,s.from.lon],[s.dest.lat,s.dest.lon]];
  L.marker(pts[0],{icon:icon('집','home')}).addTo(layer);L.marker(pts[1],{icon:icon('도착','dest')}).addTo(layer);
  s.stops.forEach((x,i)=>{L.marker([x.lat,x.lon],{icon:icon(i+1)}).addTo(layer);pts.push([x.lat,x.lon])});
  map.fitBounds(pts,{paddingTopLeft:[30,40],paddingBottomRight:[30,(window.innerHeight*0.6)|0]});
}
function sharePerson(i){const s=window._sch,x=s.stops[i],t=new Date(x.time);share(`[픽업 장소 안내]\n${x.name}님 / ${t.getMonth()+1}월 ${t.getDate()}일 ${hm(t)}\n\n${x.label}${x.memo?'\n'+x.memo:''}\n\n▶ 카카오맵에서 위치 보기\nhttps://map.kakao.com/link/map/${encodeURIComponent(x.label)},${x.lat},${x.lon}\n▶ 로드뷰로 실제 모습 보기\nhttps://map.kakao.com/link/roadview/${x.lat},${x.lon}`)}
function copyAcc(){const s=window._sch,a=new Date(s.arrive);share(`${a.getFullYear()}-${a.getMonth()+1}-${a.getDate()}\t${s.destName}\t운전 ${dur(s.drive)}\t${(s.meters/1000).toFixed(1)}km\t기름값 ${Math.round(s.fuel)}원\t통행료 ${s.toll||0}원`)}
function delSchedule(){schedules=schedules.filter(x=>x.id!==window._sch.id);S.set('schedules',schedules);go('home')}


// ---------- 구글 시트 연결 ----------
const Sync={
  st:S.get('syncstate',{last:null,msg:'',busy:false}),
  drafts:S.get('drafts',{}),
  ok(){return!!settings.syncUrl},
  url(){const u=settings.syncUrl;return u},
  async get(){const r=await fetch(this.url());const j=await r.json();if(!j.ok)throw new Error(j.error||'시트 오류');return j},
  async post(body){
    const u=new URL(this.url());body.token=u.searchParams.get('token');
    const r=await fetch(u.origin+u.pathname,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    try{return await r.json()}catch(e){return{ok:r.ok}}
  },
  save(){S.set('syncstate',this.st);S.set('drafts',this.drafts)},
  parseDate(d,t){const m=String(d).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);const tm=String(t||'').match(/(\d{1,2}):(\d{2})/);if(!m||!tm)return null;
    const x=new Date(+m[1],+m[2]-1,+m[3],+tm[1],+tm[2]);return isNaN(x)?null:x},
  async run(){
    if(!this.ok()||this.st.busy)return;
    this.st.busy=true;this.st.msg='시트 확인 중...';if(cur==='home')renderHome();
    try{
      const j=await this.get();
      // 멤버: 시트가 기준
      const byName={};
      for(const r of j.members){
        let lat=+r.lat,lon=+r.lon;
        if(!(lat&&lon)&&r.addr&&!demo()){const g=await API.geo(r.addr);if(g){lat=g.lat;lon=g.lon;this.post({action:'memberGeo',row:r.row,lat,lon})}}
        const p=byName[r.name]||(byName[r.name]={id:'m:'+r.name,name:r.name,phone:r.phone||'',spots:[],fromSheet:true});
        if(r.phone&&!p.phone)p.phone=r.phone;
        if(lat&&lon){const sp={label:r.label||(p.spots.length?'':'집'),name:r.addr||r.label,lat,lon,memo:r.memo||'',row:r.row};r.def==='Y'?p.spots.unshift(sp):p.spots.push(sp)}
      }
      const sheetPeople=Object.values(byName).filter(p=>p.spots.length);
      const missing=Object.values(byName).filter(p=>!p.spots.length).map(p=>p.name);
      const names=new Set(sheetPeople.map(p=>p.name));
      people=sheetPeople.concat(people.filter(p=>!p.fromSheet&&!names.has(p.name)));S.set('people',people);
      // 공연: 새 일정이면 자동 계산
      let made=0;const now=Date.now();
      for(const ev of j.events){
        const key=ev.id||('r'+ev.row);
        const st=ev.status||'새 일정';
        if(st==='확정'||st==='취소'){delete this.drafts[key];continue}
        const arrive=this.parseDate(ev.date,ev.arrive||ev.show);
        if(!arrive||arrive<now||arrive-now>60*864e5)continue;
        const want=String(ev.people||'').split(/[,·\/\s]+/).map(x=>x.trim()).filter(Boolean);
        const sel=people.filter(p=>want.some(w=>p.name.includes(w)||w.includes(p.name)));
        const d=this.drafts[key];
        if(d&&d.sig===JSON.stringify([ev.date,ev.arrive,ev.place,ev.addr,ev.people])&&d.plan)continue;
        let lat=+ev.lat,lon=+ev.lon;
        if(!(lat&&lon)){const g=await API.geo(ev.addr||ev.place);if(g){lat=g.lat;lon=g.lon;this.post({action:'eventGeo',row:ev.row,lat,lon})}}
        const draft={key,row:ev.row,title:ev.title||ev.place,place:ev.place,arrive:arrive.toISOString(),want,unknown:want.filter(w=>!sel.some(p=>p.name.includes(w)||w.includes(p.name))),
          sig:JSON.stringify([ev.date,ev.arrive,ev.place,ev.addr,ev.people]),dest:lat&&lon?{name:ev.place||ev.title,addr:ev.addr,lat,lon}:null,ids:sel.map(p=>p.id)};
        if(draft.dest&&sel.length&&settings.home){
          const pad=n=>String(n).padStart(2,'0');
          job=Object.assign(newJob(),{dest:draft.dest,from:settings.home,date:`${arrive.getFullYear()}-${pad(arrive.getMonth()+1)}-${pad(arrive.getDate())}`,time:hm(arrive),ids:draft.ids,eventKey:key,eventRow:ev.row,eventTitle:draft.title});
          const P=await planAll(sel);const pick=P[1].seq.length?1:0;const f=finalize(P[pick],arrive);
          draft.plan=P[pick].name;draft.depart=f.depart.toISOString();draft.job=job;
          draft.order=f.stops.map(s=>`${hm(s.time)} ${s.p.name}(${s.c.label})`).join(' → ')+(P[pick].selfs.length?' / 따로: '+P[pick].selfs.map(x=>x.p.name).join(', '):'');
          this.post({action:'saveEvent',row:ev.row,status:'계산됨',depart:hm(f.depart),plan:draft.plan,order:draft.order,fuel:Math.round(f.fuel)});
          made++;
        }
        this.drafts[key]=draft;
      }
      this.st.last=new Date().toISOString();
      this.st.msg=(made?`새 공연 ${made}건 픽업안을 짰어요`:'시트와 맞춰졌어요')+(missing.length?` · 주소 못 찾은 사람: ${missing.join(', ')}`:'');
    }catch(e){this.st.msg='시트 연결 실패: '+e.message}
    finally{this.st.busy=false;this.save();if(cur==='home')renderHome()}
  },
  homeHtml(){
    if(!this.ok())return'';
    let h=`<div class="muted" style="margin-bottom:8px">${this.st.busy?'<span class="spin" style="border-color:var(--b);border-right-color:transparent;width:12px;height:12px;border-width:2px"></span> ':''}${esc(this.st.msg||'')}</div>`;
    const ds=Object.values(this.drafts).sort((a,b)=>a.arrive<b.arrive?-1:1);
    if(ds.length)h+=`<div class="h" style="margin-top:4px">새 공연 픽업안</div>`;
    ds.forEach(d=>{const a=new Date(d.arrive);
      let sub=d.plan?`${hm(new Date(d.depart))} 출발 · ${esc(d.plan)}`:!d.dest?'공연 장소를 못 찾았어요 · 눌러서 정하기':!d.ids.length?'태울 사람을 골라주세요':'계산 대기';
      if(d.unknown&&d.unknown.length)sub+=` · 명단에 없는 이름: ${esc(d.unknown.join(', '))}`;
      h+=`<button class="card" style="width:100%;text-align:left;border:2px solid var(--b);background:#F3F6FF;margin-bottom:8px;display:flex;gap:14px;align-items:center" onclick="Sync.open('${esc(d.key)}')">
      <div style="text-align:center;min-width:44px"><div class="muted">${a.getMonth()+1}월</div><div style="font-size:24px;font-weight:900">${a.getDate()}</div></div>
      <div style="min-width:0;flex:1"><div style="font-weight:700">${esc(d.title||'')} · ${hm(a)} 도착</div><div class="muted">${sub}</div></div><span style="color:var(--b);font-weight:700">확인 ›</span></button>`});
    return h;
  },
  async open(key){
    const d=this.drafts[key];if(!d)return;
    const a=new Date(d.arrive),pad=n=>String(n).padStart(2,'0');
    job=d.job||Object.assign(newJob(),{dest:d.dest,from:settings.home,date:`${a.getFullYear()}-${pad(a.getMonth()+1)}-${pad(a.getDate())}`,time:hm(a),ids:d.ids,eventKey:key,eventRow:d.row,eventTitle:d.title});
    saveJob();
    if(!job.dest||!job.ids.length){go('form');toast(!job.dest?'도착지를 정해주세요':'태울 사람을 골라주세요');return}
    go('form');await runCalc();
  },
  async pushPerson(p){
    if(!this.ok())return;
    const spots=p.spots.filter(s=>!s.row);if(!spots.length)return;
    try{await this.post({action:'addMember',name:p.name,phone:p.phone,spots:spots.map(s=>({label:s.label,addr:s.addr||s.name,lat:s.lat,lon:s.lon,memo:s.memo}))});
      p.fromSheet=true;p.id='m:'+p.name;S.set('people',people)}catch(e){}
  },
  async pushConfirm(s,p,f){
    if(!this.ok())return;
    const order=s.stops.map(x=>`${hm(new Date(x.time))} ${x.name}(${x.label})`).join(' → ')+(s.selfs.length?' / 따로: '+s.selfs.map(x=>x.name).join(', '):'');
    const desc=noticeText(s);
    try{
      if(job.eventRow){await this.post({action:'saveEvent',row:job.eventRow,status:'확정',depart:hm(new Date(s.depart)),plan:s.planName,order,fuel:Math.round(s.fuel),departIso:s.depart,arriveIso:s.arrive,title:s.destName+(job.eventTitle&&job.eventTitle!==s.destName?' ('+job.eventTitle+')':''),desc});
        delete this.drafts[job.eventKey];this.save()}
      else{const a=new Date(s.arrive),W='일월화수목금토';await this.post({action:'addEvent',date:`${a.getFullYear()}.${String(a.getMonth()+1).padStart(2,'0')}.${String(a.getDate()).padStart(2,'0')} (${W[a.getDay()]})`,arrive:hm(a),title:s.destName,place:s.destName,lat:s.dest.lat,lon:s.dest.lon,people:s.stops.map(x=>x.name).concat(s.selfs.map(x=>x.name)).join(', '),status:'확정',depart:hm(new Date(s.depart)),plan:s.planName,order,fuel:Math.round(s.fuel)})}
      toast('시트에 저장했어요');
    }catch(e){toast('시트 저장 실패: '+e.message,3500)}
  }
};

// ---------- 시작 ----------
initMap();go('home');Sync.run();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Sync.ok()&&Date.now()-new Date(Sync.st.last||0)>5*60e3)Sync.run()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
