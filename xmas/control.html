<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>관제실 · 미리메리 크리스마스</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B2418">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A1%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--red:#D7263D;--red2:#A3172A;--green:#1F8A4C;--night:#0B2418;--card:#14331F;--card2:#1B4029;--gold:#E8C468;--mut:#B7C9BC;}
html,body{min-height:100%;font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;background:#081A10;color:#fff;}
button,input,textarea,select{font-family:inherit;}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--night);border-bottom:3px solid var(--red);position:sticky;top:0;z-index:20;}
header h1{font-size:19px;font-weight:900;}
header h1 b{color:var(--red);-webkit-text-stroke:.5px #fff;paint-order:stroke fill;}
header .sp{flex:1;}
header a,header button{color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer;}
.demo{font-size:12px;font-weight:900;color:#0B2418;background:var(--gold);padding:3px 9px;border-radius:10px;}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);gap:16px;padding:16px;max-width:1500px;margin:0 auto;}
@media (max-width:900px){main{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;margin-bottom:16px;}
.card h2{font-size:16px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.card h2 small{font-size:12.5px;color:var(--mut);font-weight:700;margin-left:auto;}
/* 지도 */
.mapBar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.mapBar button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:800;cursor:pointer;}
.mapBar button.on{background:#fff;color:var(--red2);}
.mapBox{position:relative;height:min(68vh,720px);overflow:auto;border-radius:12px;background:#08200F;}
.mapIn{position:relative;width:100%;}
.mapIn img{display:block;width:100%;height:auto;}
.mk{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:3;cursor:pointer;}
.mk .nm{margin-top:2px;background:var(--c);color:#fff;font-size:12px;font-weight:900;padding:1px 7px;border-radius:8px;border:1.5px solid #fff;white-space:nowrap;}
.mk.stale .nm{background:#6B7280;}
.mk .acc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.45);pointer-events:none;z-index:-1;}
.mk.hid{opacity:.45;}
.shop{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--red);transform:translate(-50%,-50%);z-index:2;opacity:.85;}
.mapBox.noShops .shop{display:none;}
/* 산타 상태 */
table{width:100%;border-collapse:collapse;font-size:14px;}
th{color:var(--mut);font-weight:800;font-size:12.5px;text-align:left;padding:6px;border-bottom:1px solid rgba(255,255,255,.12);}
td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:middle;}
tr.click{cursor:pointer;}tr.click:hover{background:rgba(255,255,255,.05);}
.who{display:flex;align-items:center;gap:8px;font-weight:900;}
.st{display:inline-block;font-size:12px;font-weight:900;padding:3px 8px;border-radius:12px;white-space:nowrap;}
.st.live{background:rgba(46,204,113,.2);color:#7CF0A8;}.st.stale{background:rgba(232,196,104,.2);color:var(--gold);}.st.off{background:rgba(255,255,255,.1);color:var(--mut);}
.tgl{position:relative;display:inline-block;width:46px;height:26px;}
.tgl input{opacity:0;width:0;height:0;}
.tgl span{position:absolute;inset:0;background:#555;border-radius:13px;transition:.2s;cursor:pointer;}
.tgl span::before{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;}
.tgl input:checked+span{background:var(--green);}
.tgl input:checked+span::before{transform:translateX(20px);}
.low{color:#FF9AA5;font-weight:900;}
/* 알림 보내기 */
label{display:block;font-size:13px;color:var(--mut);font-weight:800;margin:10px 0 5px;}
input[type=text],input[type=url],input[type=email],input[type=password],textarea,select{width:100%;font-size:15px;padding:11px 12px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);background:#fff;color:#111;outline:none;}
textarea{min-height:84px;resize:vertical;line-height:1.5;}
.tpl{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.tpl button{background:rgba(255,255,255,.1);color:#fff;border:1px dashed rgba(255,255,255,.35);border-radius:16px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer;}
.hint{font-size:12.5px;color:var(--mut);margin-top:5px;line-height:1.45;}
.hint.bad{color:#FF9AA5;font-weight:800;}
.btn{border:none;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:900;color:#fff;background:var(--red);cursor:pointer;}
.btn:disabled{opacity:.5;cursor:default;}
.btn.wide{width:100%;margin-top:14px;}
.btn.g{background:rgba(255,255,255,.14);}
/* 미리보기 */
.pv{background:var(--cream,#FFF7EC);color:#2A1A10;border-radius:14px;padding:14px;margin-top:12px;border:3px solid var(--red);text-align:center;}
.pv .t{font-size:17px;font-weight:900;color:var(--red2);word-break:keep-all;}
.pv .m{font-size:14px;line-height:1.55;margin-top:6px;white-space:pre-line;word-break:keep-all;}
.pv .b{margin-top:10px;background:linear-gradient(45deg,#F58529,#DD2A7B 50%,#8134AF);color:#fff;border-radius:10px;padding:10px;font-weight:900;font-size:14px;}
.pvL{font-size:12px;color:var(--mut);font-weight:800;margin-top:12px;}
/* 보낸 알림 */
.al{border-bottom:1px solid rgba(255,255,255,.08);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px;}
.al .t{font-weight:900;font-size:14.5px;word-break:keep-all;}
.al .m{font-size:13px;color:var(--mut);white-space:pre-line;word-break:keep-all;}
.al .l{font-size:12.5px;color:var(--gold);word-break:break-all;}
.al .n{grid-column:1/-1;display:flex;gap:12px;font-size:13px;font-weight:800;align-items:center;flex-wrap:wrap;}
.al .n span{background:rgba(255,255,255,.08);padding:3px 9px;border-radius:10px;}
.al .del{background:none;border:1px solid rgba(255,255,255,.25);color:var(--mut);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;align-self:start;}
.empty{color:var(--mut);font-size:14px;padding:12px 0;}
/* 로그인 */
#loginBox{max-width:380px;margin:60px auto;padding:0 16px;}
.err{color:#FF9AA5;font-size:14px;font-weight:700;margin-top:8px;min-height:1em;}
.hide{display:none!important;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--green);color:#fff;font-weight:900;padding:12px 20px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;border:1.5px solid rgba(255,255,255,.5);}
.toast.show{opacity:1;}
</style></head><body>
<header><h1>📡 미리메리 <b>관제실</b></h1><span id="demoTag"></span><span class="sp"></span><a href="index.html" target="_blank">손님 지도 ↗</a><a id="instaLink" href="#" target="_blank" rel="noopener">우리 인스타 ↗</a><button id="logoutBtn" class="hide" onclick="BE.logout()">로그아웃</button></header>

<div id="loginBox" class="card">
 <h2>🔐 관제실 로그인</h2>
 <label>이메일</label><input id="email" type="email" autocomplete="username">
 <label>비밀번호</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
 <button class="btn wide" onclick="doLogin()">로그인</button>
 <div class="err" id="loginErr"></div>
</div>

<main id="main" class="hide">
 <section>
  <div class="card">
   <h2>🗺️ 산타요정 위치 <small id="liveCount"></small></h2>
   <div class="mapBar"><button onclick="setZoom(1)" class="on" data-z="1">전체</button><button onclick="setZoom(1.8)" data-z="1.8">확대</button><button onclick="setZoom(2.8)" data-z="2.8">크게</button><button id="shopTgl" onclick="toggleShops()">🎁 매장 표시 끄기</button></div>
   <div class="mapBox" id="mapBox"><div class="mapIn" id="mapIn"><img src="img/map.xmas.webp" alt="" id="mapImg"></div></div>
  </div>
  <div class="card">
   <h2>🎅 산타요정 상태 <small>3분 안 = 실시간 · 10분 넘으면 손님 지도에서 사라짐</small></h2>
   <table><thead><tr><th>산타요정</th><th>상태</th><th>마지막 위치</th><th>오차</th><th>배터리</th><th>손님에게 보이기</th></tr></thead><tbody id="sTbody"></tbody></table>
  </div>
 </section>
 <section>
  <div class="card">
   <h2>📬 산타 메시지 보내기</h2>
   <label>제목</label>
   <input type="text" id="aTitle" maxlength="60" value="🎅 산타로부터 메시지가 도착했어요!">
   <label>내용</label>
   <textarea id="aMsg" maxlength="300" placeholder="예) 루돌프 요정이 전포카페거리에 나타났대요! 스토리에서 힌트를 확인하세요"></textarea>
   <div class="tpl" id="tpl"></div>
   <label>인스타 링크 (게시물·스토리·릴스 주소)</label>
   <input type="url" id="aLink" placeholder="https://www.instagram.com/stories/...">
   <div class="hint" id="linkHint">인스타 앱 → 게시물/스토리 ⋯ → "링크 복사" 후 붙여넣기</div>
   <label>보내는 산타요정 (선택)</label>
   <select id="aSanta"><option value="">선택 안 함</option></select>
   <div class="pvL">👀 손님 화면 미리보기</div>
   <div class="pv" id="pv"></div>
   <button class="btn wide" id="sendBtn" onclick="sendAlert()">📣 손님 모두에게 보내기</button>
   <div class="hint">앱을 켜 둔 손님에게 바로 팝업이 떠요. 앱을 늦게 연 손님도 1시간 안에 보낸 메시지는 열자마자 떠요.</div>
  </div>
  <div class="card">
   <h2>📊 보낸 메시지 <small>👀 팝업 본 사람 · 👆 인스타 누른 사람 (폰 1대 = 1명)</small></h2>
   <div id="aList"></div>
  </div>
 </section>
</main>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/santas.js"></script>
<script src="js/backend.js"></script>
<script src="data/shops.js"></script>
<script>
const $ = id => document.getElementById(id);
let santaData = {}, alerts = [], stats = {}, started = false;
$('email').value = STAFF_EMAIL;
if (!BE.LIVE) $('demoTag').innerHTML = '<span class="demo">연습 모드</span>';
if (safeLink(EVENT.instagram)) $('instaLink').href = EVENT.instagram; else $('instaLink').classList.add('hide');
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(window._t); window._t = setTimeout(() => e.classList.remove('show'), 2200); }

async function doLogin() {
  $('loginErr').textContent = '';
  try { await BE.login($('email').value.trim(), $('pw').value); } catch (e) { $('loginErr').textContent = '로그인 실패: 이메일·비밀번호를 확인해 주세요'; }
}

/* ---------- 지도 ---------- */
SHOPS.forEach(s => { const d = document.createElement('div'); d.className = 'shop'; d.title = s.name; d.style.left = s.x * 100 + '%'; d.style.top = s.y * 100 + '%'; $('mapIn').appendChild(d); });
function setZoom(z) {
  const box = $('mapBox'), cx = (box.scrollLeft + box.clientWidth / 2) / box.scrollWidth, cy = (box.scrollTop + box.clientHeight / 2) / box.scrollHeight;
  $('mapIn').style.width = z * 100 + '%';
  box.scrollLeft = cx * box.scrollWidth - box.clientWidth / 2; box.scrollTop = cy * box.scrollHeight - box.clientHeight / 2;
  document.querySelectorAll('.mapBar [data-z]').forEach(b => b.classList.toggle('on', +b.dataset.z === z));
}
function toggleShops() { const b = $('mapBox'); b.classList.toggle('noShops'); $('shopTgl').textContent = b.classList.contains('noShops') ? '🎁 매장 표시 켜기' : '🎁 매장 표시 끄기'; }
function focusSanta(id) {
  const v = santaData[id], xy = v && geoToXY(v.lat, v.lng); if (!xy) { toast('지도에 표시할 위치가 없어요'); return; }
  if (parseFloat($('mapIn').style.width || '100') < 150) setZoom(1.8);
  const box = $('mapBox'); box.scrollTo({ left: xy.x * box.scrollWidth - box.clientWidth / 2, top: xy.y * box.scrollHeight - box.clientHeight / 2, behavior: 'smooth' });
}
const mks = {};
function render() {
  const now = BE.now(); let live = 0;
  const imgW = $('mapImg').clientWidth || 1, pxPerM = imgW / (2600 * GEO_MPX);
  SANTAS.forEach(s => {
    const v = santaData[s.id], st = santaState(v, now), xy = st !== 'off' ? geoToXY(v.lat, v.lng) : null;
    if (st === 'live' && !(v && v.hidden)) live++;
    let m = mks[s.id];
    if (!xy) { if (m) { m.remove(); delete mks[s.id]; } return; }
    if (!m) { m = document.createElement('div'); m.className = 'mk'; m.style.setProperty('--c', s.color); m.onclick = () => focusSanta(s.id); $('mapIn').appendChild(m); mks[s.id] = m; }
    const r = Math.max(8, (v.acc || 10) * pxPerM * 2);
    m.className = 'mk' + (st === 'stale' ? ' stale' : '') + (v.hidden ? ' hid' : '');
    m.innerHTML = `<span class="acc" style="width:${r}px;height:${r}px"></span>${santaSVG(s.color, st === 'stale', 34)}<span class="nm">${escHTML(s.name)}${v.hidden ? ' (숨김)' : ''}</span>`;
    m.style.left = xy.x * 100 + '%'; m.style.top = xy.y * 100 + '%';
  });
  $('liveCount').textContent = `지금 손님 지도에 보이는 산타 ${live}명`;
  $('sTbody').innerHTML = SANTAS.map(s => {
    const v = santaData[s.id] || {}, st = santaState(v, now), xy = v.lat != null && geoToXY(v.lat, v.lng);
    const stTxt = st === 'live' ? (xy ? '🟢 실시간' : '🟡 지도 밖') : st === 'stale' ? '🟡 신호 약함' : (v.on === false && v.ts ? '⚫ 멈춤(쉬는 중)' : '⚫ 꺼짐');
    return `<tr class="click" onclick="focusSanta('${s.id}')"><td><div class="who">${santaSVG(s.color, st !== 'live', 28)}${escHTML(s.name)}</div></td><td><span class="st ${st}">${stTxt}</span></td><td>${v.ts ? agoText(now - v.ts) : '-'}</td><td>${v.acc ? v.acc + 'm' : '-'}</td><td class="${v.bat != null && v.bat <= 20 ? 'low' : ''}">${v.bat != null ? v.bat + '%' : '-'}</td><td onclick="event.stopPropagation()"><label class="tgl"><input type="checkbox" ${v.hidden ? '' : 'checked'} onchange="BE.setHidden('${s.id}',!this.checked).then(()=>toast(this.checked?'손님 지도에 보여요':'손님 지도에서 숨겼어요'))"><span></span></label></td></tr>`;
  }).join('');
}
setInterval(() => { if (started) render(); }, 5000);
addEventListener('resize', () => { if (started) render(); });

/* ---------- 알림 ---------- */
const TPL = [
  ['📍 위치 힌트', '산타요정이 새로운 곳에 나타났어요! 인스타 스토리에서 힌트 사진을 확인하세요 👀'],
  ['📸 새 스토리', '산타요정의 새 스토리가 올라왔어요! 지금 바로 확인해 보세요 🎄'],
  ['⏰ 마감 임박', '산타요정이 곧 숨으러 가요! 서두르세요 🏃'],
  ['🎁 이벤트', '산타요정을 찾은 분께 선물을 드려요! 자세한 건 게시물에서 확인하세요 🎁'],
];
$('tpl').innerHTML = TPL.map((t, i) => `<button onclick="useTpl(${i})">${t[0]}</button>`).join('');
function useTpl(i) { $('aMsg').value = TPL[i][1]; preview(); }
SANTAS.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.name; $('aSanta').appendChild(o); });
['aTitle', 'aMsg', 'aLink', 'aSanta'].forEach(id => $(id).addEventListener('input', preview));
function linkCheck() {
  const u = $('aLink').value.trim(), h = $('linkHint');
  if (!u) { h.className = 'hint'; h.textContent = '인스타 앱 → 게시물/스토리 ⋯ → "링크 복사" 후 붙여넣기 (비워두면 메시지만 보내요)'; return true; }
  if (!/^https:\/\//i.test(u)) { h.className = 'hint bad'; h.textContent = '⚠️ https:// 로 시작하는 주소를 넣어주세요'; return false; }
  if (!/instagram\.com|instagr\.am/i.test(u)) { h.className = 'hint'; h.textContent = '인스타 주소가 아니에요. 다른 링크도 보낼 수는 있어요'; return true; }
  h.className = 'hint'; h.textContent = '✅ 인스타 링크 확인'; return true;
}
function preview() {
  linkCheck(); const s = SANTA_BY_ID[$('aSanta').value];
  $('pv').innerHTML = `<div class="t">${escHTML($('aTitle').value || '🎅 산타로부터 메시지가 도착했어요!')}</div>${s ? `<div class="m" style="font-weight:800">${escHTML(josa(s.name, '이', '가'))} 보냄</div>` : ''}<div class="m">${escHTML($('aMsg').value)}</div>${$('aLink').value.trim() ? '<div class="b">📸 인스타에서 확인하기</div>' : ''}`;
}
preview();
async function sendAlert() {
  if (!linkCheck()) return;
  const a = { title: $('aTitle').value.trim() || '🎅 산타로부터 메시지가 도착했어요!', msg: $('aMsg').value.trim(), link: $('aLink').value.trim(), santa: $('aSanta').value };
  if (!a.msg && !a.link) { toast('내용이나 인스타 링크 중 하나는 넣어주세요'); return; }
  if (!confirm('지금 앱을 켠 손님 모두에게 보낼까요?\n\n' + a.title + '\n' + a.msg)) return;
  $('sendBtn').disabled = true;
  try { await BE.sendAlert(a); toast('📣 보냈어요!'); $('aMsg').value = ''; $('aLink').value = ''; preview(); }
  catch (e) { toast('보내기 실패: 로그인 상태와 인터넷을 확인해 주세요'); }
  $('sendBtn').disabled = false;
}
function renderAlerts() {
  const now = BE.now();
  $('aList').innerHTML = alerts.length ? alerts.map(a => { const st = stats[a.key] || {}, s = SANTA_BY_ID[a.santa], o = st.opens || 0, c = st.clicks || 0;
    return `<div class="al"><div><div class="t">${escHTML(a.title)}</div>${s ? `<div class="m">🎅 ${escHTML(s.name)}</div>` : ''}${a.msg ? `<div class="m">${escHTML(a.msg)}</div>` : ''}${a.link ? `<a class="l" href="${escHTML(safeLink(a.link))}" target="_blank" rel="noopener">${escHTML(a.link)}</a>` : ''}</div><button class="del" onclick="delAlert('${a.key}')">삭제</button>
    <div class="n"><span>🕒 ${agoText(now - a.ts)}</span><span>👀 ${o}명</span><span>👆 ${c}명</span>${o ? `<span>누른 비율 ${Math.round(c / o * 100)}%</span>` : ''}</div></div>`; }).join('')
    : '<div class="empty">아직 보낸 메시지가 없어요</div>';
}
function delAlert(k) { if (confirm('이 메시지를 지울까요? 손님 메시지함에서도 사라져요')) BE.deleteAlert(k).then(() => toast('지웠어요')); }
setInterval(() => { if (started) renderAlerts(); }, 30000);

BE.ready().then(() => BE.onAuth(u => {
  $('loginBox').classList.toggle('hide', !!u); $('main').classList.toggle('hide', !u); $('logoutBtn').classList.toggle('hide', !u);
  if (u && !started) {
    started = true;
    BE.onSantas(d => { santaData = d || {}; render(); });
    BE.onAlerts(l => { alerts = l; renderAlerts(); }, 50);
    BE.onStats(s => { stats = s || {}; renderAlerts(); });
  }
})).catch(() => { $('loginErr').textContent = '서버에 연결하지 못했어요. 인터넷을 확인하고 새로고침 해주세요'; });
</script>
</body></html>
